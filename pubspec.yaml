name: monvlog
description: "MonVlog — Mongolian YouTube vlogs (phone community + Netflix TV)"
publish_to: 'none'
version: 1.0.2+4

environment:
  # Match Flutter 3.41.x / Dart 3.11.x (current user stable). Avoid ^3.14 /
  # youtube_player_flutter 11 until the toolchain upgrades.
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^16.2.1

  # State (Riverpod chosen for M0; see plan §3)
  flutter_riverpod: ^2.6.1

  # Networking (YouTube Data API v3)
  dio: ^5.9.0

  # Billing — RevenueCat stubbed until M4 ($3.99/mo product)
  purchases_flutter: ^8.10.1

  # Thumbnails
  cached_network_image: ^3.4.1

  # Local continue-watching / prefs
  shared_preferences: ^2.5.3

  # Android TV YouTube fallback intents
  android_intent_plus: ^5.3.0
  google_fonts: ^8.1.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8
  local_auth: ^3.0.2
  # Pin <10.0.2: 10.0.2+ pulls material_ui (^3.13) / 11.x needs Dart 3.14+.
  # 10.0.1 uses youtube_player_iframe (same fromVideoId / YoutubePlayerParams API).
  youtube_player_flutter: 10.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  # Launcher-only source: same MonVlog mark as monvlog-logo.png, wordmark ~14% smaller;
  # white strokes thickened + edge-hardened for small mipmap clarity (size unchanged).
  image_path: assets/brand/monvlog-logo-launcher.png
  # Samsung / One UI uses roundIcon; keep both adaptive + legacy round mipmaps.
  adaptive_icon_background: "#E71616"
  # Transparent white mark (shrunk); inset supplies adaptive safe zone (avoid double padding).
  adaptive_icon_foreground: assets/brand/monvlog-icon-foreground.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: "#E71616"
  web:
    generate: true
    image_path: assets/brand/monvlog-logo-launcher.png
    background_color: "#E71616"
    theme_color: "#E71616"

flutter_native_splash:
  color: "#E71616"
  # Transparent white logo + tagline (no red fill → no washout square on #E71616).
  image: assets/brand/monvlog-splash-mark.png
  android: true
  ios: true
  android_12:
    color: "#E71616"
    icon_background_color: "#E71616"
    # Square logo-only mark — Android 12 clips splash to a circle.
    image: assets/brand/monvlog-splash-android12.png
  web: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/config/curated_channels.json
    - assets/promo/europe-tour-hero.jpg
    - assets/brand/monvlog-logo-mark.jpg
    - assets/brand/monvlog-logo.png
    - assets/brand/monvlog-logo-box.png
    - assets/brand/monvlog-splash-mark.png
