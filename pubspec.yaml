name: monvlog
description: "MonVlog — Mongolian YouTube vlogs on TV"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^16.2.1

  # State (Riverpod chosen for M0; see plan §3)
  flutter_riverpod: ^2.6.1

  # Networking (YouTube Data API later; no keys in M0)
  dio: ^5.9.0

  # Billing — RevenueCat stubbed until M4 ($3.99/mo product)
  purchases_flutter: ^8.10.1

  # Thumbnails
  cached_network_image: ^3.4.1

  # Local continue-watching / prefs
  shared_preferences: ^2.5.3

  # Android TV YouTube fallback intents
  android_intent_plus: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
